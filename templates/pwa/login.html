{% extends 'pwa/base.html' %}

{% block content %}
<style>
    .login-box {
        background: white;
        border-radius: 16px;
        padding: 32px 24px;
        margin-top: 60px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .login-icon {
        text-align: center;
        font-size: 64px;
        margin-bottom: 8px;
    }
    .login-title {
        text-align: center;
        font-size: 24px;
        font-weight: 700;
        color: #1a73e8;
        margin-bottom: 8px;
    }
    .login-subtitle {
        text-align: center;
        font-size: 14px;
        color: #666;
        margin-bottom: 28px;
    }
    .form-group {
        margin-bottom: 16px;
    }
    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #444;
        margin-bottom: 6px;
    }
    .form-group input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
        transition: border-color 0.2s;
    }
    .form-group input:focus {
        border-color: #1a73e8;
    }
</style>

<div class="login-box">
    <div class="login-icon">📄</div>
    <div class="login-title">GastosApp</div>
    <div class="login-subtitle">Gestión de facturas</div>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Usuario</label>
            <input type="text" name="username" placeholder="Tu usuario" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="password" placeholder="Tu contraseña" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top:8px;">Ingresar</button>
    </form>
</div>
{% endblock %}
